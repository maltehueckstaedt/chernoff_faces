<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Geiger-Partikel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+FR+Trad&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div id="iphone-frame">
    <button id="sound_on_button">
      Sound<br><span class="on-text">on</span>
    </button>
    <canvas id="canvas"></canvas>
  </div>

  <!-- GSAP Button Hover Animation -->
  <script>
    const btn = document.getElementById("sound_on_button");
    gsap.set(btn, { xPercent: -50, yPercent: -50 });

    let center = { x: 0, y: 0 };
    let active = false;

    function updateCenter() {
      const rect = btn.getBoundingClientRect();
      center = {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
    }

    function handleMove(x, y) {
      const dx = x - center.x;
      const dy = y - center.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 150) {
        const moveX = dx * 0.2;
        const moveY = dy * 0.2;
        gsap.to(btn, { x: moveX, y: moveY, duration: 0.3, ease: "power2.out" });
        active = true;
      } else if (active) {
        gsap.to(btn, { x: 0, y: 0, duration: 0.4, ease: "power2.out" });
        active = false;
      }
    }

    document.addEventListener("mousemove", (e) => handleMove(e.clientX, e.clientY));
    document.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    window.addEventListener("resize", updateCenter);
    updateCenter();
  </script>

  <!-- Main Particle + Sound Logic -->
  <script src="js/script.js"></script>
</body>
</html>
