<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Scroll Animation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 200vh; /* genug Scrollhöhe */
    }

    #scroll-area {
      height: 200vh;
    }

    #iphone-frame {
      width: 100vw;
      height: calc(100vw * (670 / 390));
      max-width: 390px;
      max-height: 670px;
      position: sticky;
      top: 1%;
      background-color: black;
      overflow: hidden;
      border-radius: 20px; 
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    #inner-outline {
  position: absolute;
  top: 1.4%;
  left: 2.5%;
  width: 95%;
  height: 97%;
  border-radius: 20px;
  border: 2px solid #aaff55;
  pointer-events: none;
  z-index: 5;
}


    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
</head>
<body>
  <div id="scroll-area">
    <div id="iphone-frame">
      <div id="inner-outline"></div>
      <canvas id="hero-lightpass"></canvas>
    </div>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const canvas = document.getElementById("hero-lightpass");
    const context = canvas.getContext("2d");

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    resizeCanvas();
    window.addEventListener("resize", () => {
      resizeCanvas();
      render();
    });

    const frameCount = 50;
    const currentFrame = index =>
      `images/animation_stereo/${(index + 1).toString().padStart(4, '0')}.png`;

    const images = [];
    const animation = { frame: 0 };

    for (let i = 0; i < frameCount; i++) {
      const img = new Image();
      img.src = currentFrame(i);
      images.push(img);
    }
    images[0].onload = render;

    function render() {
      const index = Math.round(animation.frame);
      const img = images[Math.min(index, frameCount - 1)];
      if (img && img.complete && img.naturalWidth !== 0) {
        context.clearRect(0, 0, canvas.width, canvas.height);

        const canvasAspect = canvas.width / canvas.height;
        const imgAspect = img.naturalWidth / img.naturalHeight;

        let drawWidth, drawHeight;
        if (imgAspect > canvasAspect) {
          drawWidth = canvas.width;
          drawHeight = canvas.width / imgAspect;
        } else {
          drawHeight = canvas.height;
          drawWidth = canvas.height * imgAspect;
        }

        const x = (canvas.width - drawWidth) / 2;
        const y = (canvas.height - drawHeight) / 2;
        context.drawImage(img, x, y, drawWidth, drawHeight);
      }
    }

    gsap.to(animation, {
      frame: frameCount - 1,
      snap: "frame",
      ease: "none",
      scrollTrigger: {
        trigger: "#scroll-area",
        start: "top top",
        end: "bottom bottom",
        scrub: 0.5
        // Kein scroller: → body wird verwendet
      },
      onUpdate: render
    });
  </script>
</body>
</html>
