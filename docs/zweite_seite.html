<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Chernoff Faces</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .button-char {
      display: block;
      transform: rotate(0deg);
      pointer-events: none;
    }
    .button-wrapper button {
      position: relative;
    }
  </style>
</head>
<body>
  <div id="iphone-frame">
    <div id="inner-outline"></div>

    <div class="container">
      <div id="chernoff" class="line"></div>
      <div id="faces" class="line"></div>
    </div>

    <div id="sun-button">
  <svg id="sun-shape" width="80" height="80" viewBox="0 0 138.89 138.89">
    <path id="sun-path" fill="#aaff55"
      d="M69.44,0 L78.27,13.71 L90.9,3.4 L95.06,19.17 L110.26,13.26 L109.34,29.54 L125.63,28.63 L119.72,43.83 L135.49,47.98 L125.18,60.62 L138.89,69.44 L125.18,78.27 L135.49,90.9 L119.72,95.06 L125.63,110.26 L109.34,109.34 L110.26,125.63 L95.06,119.72 L90.9,135.49 L78.27,125.18 L69.44,138.89 L60.62,125.18 L47.98,135.49 L43.83,119.72 L28.63,125.63 L29.54,109.34 L13.26,110.26 L19.17,95.06 L3.4,90.9 L13.71,78.27 L0,69.44 L13.71,60.62 L3.4,47.98 L19.17,43.83 L13.26,28.63 L29.54,29.54 L28.63,13.26 L43.83,19.17 L47.98,3.4 L60.62,13.71 L69.44,0 Z" />
  </svg>

  <div id="sun-label"></div>
</div>


    <div class="bottom-buttons">
      <div class="button-wrapper">
        <button><span class="button-char">汉</span></button>
        <div class="label">Home</div>
      </div>
      <div class="button-wrapper">
        <button id="about-button"><span class="button-char">A</span></button>
        <div class="label">About</div>
      </div>

      <div class="button-wrapper">
        <button><span class="button-char">V</span></button>
        <div class="label">View</div>
      </div>
      <div class="button-wrapper">
        <button><span class="button-char">设</span></button>
        <div class="label">Settings</div>
      </div>
      <div class="button-wrapper">
        <button><span class="button-char">M</span></button>
        <div class="label">Map</div>
      </div>
      <div class="button-wrapper">
        <button><span class="button-char">P</span></button>
        <div class="label">Profile</div>
      </div>
      <div class="button-wrapper">
        <button><span class="button-char">O</span></button>
        <div class="label">Chat</div>
      </div>
      <div class="button-wrapper">
        <button><span class="button-char">X</span></button>
        <div class="label">Camera</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script src="js/landing_page.js"></script>
</body>
</html>
