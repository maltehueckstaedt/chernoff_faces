<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Zweite Seite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      height: 100%;
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #iphone-frame {
      width: 390px;
      height: 844px;
      background-color: rgb(224, 164, 164);
      border-radius: 0px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="iphone-frame">
    <h1>Willkommen auf Seite 2!</h1>
  </div>

</html>
