      <svg class="target-explainer-shape" aria-hidden="true">

  <main class="mother-content">
    <div class="mother-vhs-wrap">

      <a class="mother-yt-link" href="https://youtu.be/gTH-AkU6oxs?si=zjqc4O5AVz84tnPS" target="_blank" rel="noopener noreferrer" aria-label="Watch Mother on YouTube" data-explainer-label="Mother Image" data-explainer-placement="above">

  <script src="assets/js/start_page.js?v=7"></script>
  <script>
    const ytLink = document.querySelector('.mother-yt-link');
    if (ytLink) {
      ytLink.addEventListener('click', (e) => {
        e.preventDefault();
        const href = ytLink.href;
        ytLink.classList.add('yt-launching');
        setTimeout(() => {
          ytLink.classList.remove('yt-launching');
          window.open(href, '_blank', 'noopener,noreferrer');
        }, 3000);
      });
    }
  </script>
