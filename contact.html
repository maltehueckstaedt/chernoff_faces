<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Chernoff Faces</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="contact.css" />
</head>
<body class="contact-page">
  <canvas class="dust-crosses" aria-hidden="true"></canvas>
  <div class="target-explainer target-explainer--hidden" aria-live="polite">
    <div class="target-explainer-bubble">
      <svg class="target-explainer-shape" aria-hidden="true">
        <path class="target-explainer-path"></path>
      </svg>
      <div class="target-explainer-box"></div>
    </div>
  </div>
  <canvas class="star-crosses" aria-hidden="true"></canvas>

  <header class="legal-header">
    <a class="oval brand" href="index.html" data-explainer-label="Home Button">Chernoff<br />Faces</a>
  </header>

  <main class="contact-content">
    <div class="oval contact-title" data-explainer-label="Contact" data-explainer-placement="above">Contact</div>

    <form class="contact-form" action="https://formspree.io/f/mdavnvgp" method="POST" novalidate>

      <div class="form-item">
        <button type="button" class="form-trigger" aria-expanded="false" aria-controls="email-body">
          <span>Email</span>
          <svg class="form-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
          </svg>
        </button>
        <div class="form-body" id="email-body">
          <input type="email" id="email" name="email" aria-label="Email" placeholder="your@email.com" required />
        </div>
      </div>

      <div class="form-item">
        <button type="button" class="form-trigger" aria-expanded="false" aria-controls="message-body">
          <span>Message</span>
          <svg class="form-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" />
          </svg>
        </button>
        <div class="form-body" id="message-body">
          <textarea id="message" name="message" aria-label="Message" placeholder="Write your message here..." required></textarea>
          <small class="form-note">Note: For God&rsquo;s sake, leave us alone with your commercial inquiries!</small>
        </div>
      </div>

      <button type="submit" class="oval form-submit">Send Message</button>
    </form>
  </main>

  <img class="cf-logo contact-call-us" src="assets/call_us.png" alt="Call Us" />

  <a class="impressum-link" href="imprint.html">IMPRINT / 印記 / छाप / AVISO LEGAL / MENTIONS LÉGALES / 法律声明 / إشعار قانوني</a>

  <script src="docs/js/start_page.js?v=6"></script>
  <script>
    function openFormItem(item) {
      item.classList.add('form-item--open');
      item.querySelector('.form-trigger').setAttribute('aria-expanded', 'true');
      item.querySelector('.form-body').style.maxHeight = item.querySelector('.form-body').scrollHeight + 'px';
    }

    function closeFormItem(item) {
      item.classList.remove('form-item--open');
      item.querySelector('.form-trigger').setAttribute('aria-expanded', 'false');
      item.querySelector('.form-body').style.maxHeight = null;
    }

    document.querySelectorAll('.form-trigger').forEach(function (trigger) {
      trigger.addEventListener('click', function () {
        const item = trigger.closest('.form-item');
        const isOpen = item.classList.contains('form-item--open');
        if (isOpen) {
          closeFormItem(item);
        } else {
          openFormItem(item);
          setTimeout(function () {
            const field = item.querySelector('input, textarea');
            if (field) field.focus();
          }, 60);
        }

      });
    });

    document.querySelector('.contact-form').addEventListener('submit', function (e) {
      const email = document.getElementById('email');
      const message = document.getElementById('message');
      let valid = true;

      [email, message].forEach(function (field) {
        field.classList.remove('field-error');
        if (!field.value.trim()) {
          field.classList.add('field-error');
          valid = false;
          openFormItem(field.closest('.form-item'));
        }
      });

      if (!valid) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
