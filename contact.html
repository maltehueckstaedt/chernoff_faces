<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Chernoff Faces</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="contact.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <a class="oval brand" href="index.html">Chernoff Faces</a>

    <div class="projects-box">
      <div class="projects-inner">
        <a class="oval" href="#">Mother</a>
        <a class="oval" href="#">Downner</a>
      </div>
      <div class="projects-label">Current Projects of the Chernoff Faces</div>
    </div>
  </header>

  <!-- CONTACT SECTION -->
  <section class="contact-section">
    <h1 class="contact-title">Get in Touch</h1>

    <form class="contact-form" action="#" method="post">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required />
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="What is this about?" />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message here…" required></textarea>
      </div>

      <button type="submit" class="oval form-submit">Send Message</button>
    </form>

    <a class="oval back-link" href="index.html">&larr; Back</a>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="oval oval-struck">
      LOCAL FIST
      <span class="strike"></span>
    </div>

    <a class="oval" href="contact.html">Contact</a>

    <button class="oval oval-x" aria-label="Close">&times;</button>
  </footer>

</body>
</html>
